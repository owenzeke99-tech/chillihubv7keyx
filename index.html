
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chilli Hub V7</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --red: #ff3445;
    --dark: #080809;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    background: var(--dark);
    font-family: 'Segoe UI', Arial, sans-serif;
    color: white;
}

.bg {
    position: fixed;
    inset: 0;
    z-index: -5;
    background:
        radial-gradient(circle at 15% 20%, #a8172530, transparent 40%),
        radial-gradient(circle at 85% 80%, #ed253322, transparent 40%),
        #080809;
}

.grid {
    position: fixed;
    inset: 0;
    z-index: -4;
    opacity: .12;
    background-image:
        linear-gradient(#ff344522 1px, transparent 1px),
        linear-gradient(90deg, #ff344522 1px, transparent 1px);
    background-size: 42px 42px;
}

.glow {
    position: fixed;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: #ff24301c;
    filter: blur(85px);
    animation: glowMove 10s ease-in-out infinite alternate;
    z-index: -3;
}

.glow.one { top: -120px; left: -100px; }
.glow.two {
    bottom: -120px;
    right: -100px;
    animation-delay: -5s;
}

@keyframes glowMove {
    to { transform: translate(100px, 80px); }
}

/* BACKGROUND PARTICLES */
.particle {
    position: fixed;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff4656;
    box-shadow: 0 0 10px #ff3445;
    pointer-events: none;
    z-index: -1;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(30px) scale(.5);
        opacity: 0;
    }
    30% { opacity: .8; }
    100% {
        transform: translateY(-180px) scale(1.4);
        opacity: 0;
    }
}

/* MAIN CARD */
.container {
    position: relative;
    width: min(420px, 91%);
    padding: 38px 27px 29px;
    text-align: center;
    border-radius: 23px;
    background: linear-gradient(145deg, #1b1113, #0b0b0d);
    border: 1px solid #70252d;
    box-shadow: 0 25px 80px #000b, 0 0 35px #ff344518;
    overflow: hidden;
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(30px) scale(.96);
        filter: blur(5px);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
    }
}

.container::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    height: 2px;
    width: 100%;
    background: linear-gradient(90deg, transparent, #ff3445, #ffb0b0, transparent);
    animation: borderMove 4s linear infinite;
}

@keyframes borderMove {
    to { left: 100%; }
}

/* TITLE */
h1 {
    font-size: 31px;
    font-weight: 950;
    letter-spacing: 2px;
    background: linear-gradient(90deg, #ffb1b7, #ff3445, #ff777f, #ff3445);
    background-size: 250% auto;
    color: transparent;
    background-clip: text;
    -webkit-background-clip: text;
    animation: titleFlow 5s linear infinite;
}

@keyframes titleFlow {
    to { background-position: 250% center; }
}

.subtitle {
    color: #888;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 10px;
    margin-bottom: 24px;
}

.system-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 30px;
    border: 1px solid #ffffff15;
    background: #ffffff08;
    color: #aaa;
    font-size: 10px;
    letter-spacing: 1.5px;
    margin-bottom: 27px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #4ade80;
    border-radius: 50%;
    box-shadow: 0 0 10px #4ade80;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    50% { opacity: .3; }
}

/* KEY MENU */
.key-menu {
    position: relative;
    isolation: isolate;
    padding: 25px 17px 21px;
    margin-bottom: 20px;
    border-radius: 17px;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 10% 10%, #6d17242c, transparent 55%),
        radial-gradient(ellipse at 90% 90%, #ff26351c, transparent 55%),
        linear-gradient(145deg, #211014, #0c090b);
    border: 1px solid #a52d39;
    box-shadow: 0 0 18px #ff263522,
                inset 0 0 25px #ff263510;
    animation: menuFloat 4s ease-in-out infinite;
    transition: .4s ease;
}

@keyframes menuFloat {
    0%,100% {
        transform: translateY(0);
        box-shadow: 0 0 15px #ff263522,
                    inset 0 0 20px #ff263510;
    }
    50% {
        transform: translateY(-4px);
        box-shadow: 0 0 28px #ff263544,
                    inset 0 0 30px #ff263518;
    }
}

/* ANIMATED BORDER */
.key-menu::before {
    content: "";
    position: absolute;
    inset: 0;
    padding: 1.5px;
    border-radius: inherit;
    background: conic-gradient(
        from var(--angle, 0deg),
        transparent 0deg,
        #ff303c 65deg,
        #ffb0b5 100deg,
        transparent 150deg,
        #ff303c 230deg,
        transparent 300deg
    );
    -webkit-mask:
        linear-gradient(#fff 0 0) content-box,
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    animation: borderSpin 5s linear infinite;
}

@property --angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: false;
}

@keyframes borderSpin {
    to { --angle: 360deg; }
}

/* AMBIENT LIGHT */
.ambient {
    position: absolute;
    inset: -50%;
    z-index: -1;
    background: conic-gradient(
        transparent,
        #ff34451c,
        transparent,
        #ff344518,
        transparent
    );
    animation: ambientSpin 14s linear infinite;
    pointer-events: none;
}

@keyframes ambientSpin {
    to { transform: rotate(360deg); }
}

/* LIGHT STREAK */
.light-streak {
    position: absolute;
    top: -30%;
    left: -80%;
    width: 45%;
    height: 160%;
    background: linear-gradient(
        90deg, transparent, #ff59601a, #ffffff13, transparent
    );
    transform: rotate(20deg);
    animation: streakMove 4s ease-in-out infinite;
    pointer-events: none;
}

@keyframes streakMove {
    0%,20% { left: -80%; }
    80%,100% { left: 150%; }
}

/* KEY HEADER */
.key-header {
    position: relative;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.key-label {
    font-size: 11px;
    font-weight: 900;
    color: #ff7780;
    letter-spacing: 1.7px;
    text-shadow: 0 0 12px #ff303c66;
}

.version {
    font-size: 9px;
    color: #999;
    letter-spacing: 1px;
    animation: versionPulse 2s infinite;
}

@keyframes versionPulse {
    50% { color: #ff6873; }
}

/* KEY INPUT */
.key-box {
    position: relative;
    z-index: 3;
    padding: 18px 12px;
    border-radius: 12px;
    background: linear-gradient(110deg, #080809, #190c10, #080809);
    background-size: 200% 100%;
    border: 1px solid #64232d;
    box-shadow: inset 0 0 18px #ff303c0b;
    overflow: hidden;
    transition: .35s ease;
    animation: inputBackground 6s ease infinite;
}

@keyframes inputBackground {
    50% { background-position: 100% 0; }
}

.key-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: -100%;
    height: 100%;
    width: 65%;
    background: linear-gradient(
        90deg, transparent, #ff53531e, #ffffff12, transparent
    );
    transform: skewX(-20deg);
    animation: inputScan 3.5s ease-in-out infinite;
    pointer-events: none;
}

@keyframes inputScan {
    0%,15% { left: -100%; }
    75%,100% { left: 150%; }
}

.key-box:hover {
    border-color: #ff4b58;
    box-shadow: 0 0 12px #ff303c33,
                0 0 28px #ff303c18,
                inset 0 0 18px #ff303c12;
    transform: scale(1.015);
}

#key {
    position: relative;
    z-index: 2;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #fff;
    font-family: Consolas, monospace;
    font-size: 11px;
    text-align: center;
}

/* INTERNAL PARTICLES */
.key-particle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff5361;
    box-shadow: 0 0 9px #ff303c;
    pointer-events: none;
    animation: keyParticle 3s ease-in-out infinite;
    z-index: 1;
}

@keyframes keyParticle {
    0%,100% {
        opacity: 0;
        transform: translateY(12px) scale(.5);
    }
    50% {
        opacity: .9;
        transform: translateY(-15px) scale(1.5);
    }
}

/* POINTER GLOW */
.pointer-glow {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: #ff303c20;
    filter: blur(35px);
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0;
    z-index: 0;
    transition: opacity .3s;
}

/* COPY BUTTON */
.copy-btn {
    width: 100%;
    position: relative;
    padding: 16px;
    overflow: hidden;
    border: 1px solid #ff5c66;
    border-radius: 12px;
    background: linear-gradient(105deg, #9f1425, #ed293b, #a81729);
    background-size: 200% 100%;
    color: white;
    font-size: 13px;
    font-weight: 950;
    letter-spacing: 2.5px;
    cursor: pointer;
    box-shadow: 0 7px 24px #ff303c30;
    transition: .3s;
    animation: buttonFlow 5s ease infinite;
}

@keyframes buttonFlow {
    50% { background-position: 100% 0; }
}

.copy-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 65%;
    height: 100%;
    background: linear-gradient(
        90deg, transparent, #ffffff55, transparent
    );
    transform: skewX(-25deg);
    transition: .7s;
}

.copy-btn:hover::before { left: 150%; }

.copy-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px #ff344555;
    filter: brightness(1.12);
}

.copy-btn:active { transform: scale(.97); }

.status {
    margin-top: 16px;
    min-height: 18px;
    font-size: 11px;
    color: #777;
}

.footer {
    margin-top: 26px;
    padding-top: 17px;
    border-top: 1px solid #ffffff10;
    color: #626262;
    font-size: 10px;
    letter-spacing: 1.4px;
}

.footer span {
    color: #ff4a55;
    font-weight: 900;
}

@media(max-width: 420px) {
    .container { padding: 34px 21px 26px; }
    h1 { font-size: 27px; }
}

@media(prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="grid"></div>
<div class="glow one"></div>
<div class="glow two"></div>

<div class="container">

    <h1>CHILLI HUB V7</h1>
    <div class="subtitle">PREMIUM ACCESS SYSTEM</div>

    <div class="system-status">
        <span class="dot"></span>
        SYSTEM ONLINE
    </div>

    <div class="key-menu">

        <div class="ambient"></div>
        <div class="light-streak"></div>
        <div class="pointer-glow"></div>

        <div class="key-header">
            <span class="key-label">YOUR ACCESS KEY</span>
            <span class="version">VERSION 7.0</span>
        </div>

        <div class="key-box">
            <input
                id="key"
                type="text"
                readonly
                value="ChilliHubV7StealAnEggKeyHsksowjwoJslsownwnlLakwLakwjwi">
        </div>

    </div>

    <button class="copy-btn" onclick="copyKey()">
        <span id="btnText">COPY KEY</span>
    </button>

    <div class="status" id="status">
        Ready to copy your access key
    </div>

    <div class="footer">
        POWERED BY <span>CHILLI HUB</span> · 2026
    </div>

</div>

<script>
// BACKGROUND PARTICLES
for (let i = 0; i < 55; i++) {
    const p = document.createElement("div");
    p.className = "particle";
    p.style.left = Math.random() * 100 + "vw";
    p.style.top = Math.random() * 100 + "vh";
    p.style.animationDuration = (5 + Math.random() * 9) + "s";
    p.style.animationDelay = (-Math.random() * 10) + "s";
    document.body.appendChild(p);
}

// KEY MENU PARTICLES
const keyMenu = document.querySelector(".key-menu");
const pointerGlow = keyMenu.querySelector(".pointer-glow");

for (let i = 0; i < 22; i++) {
    const particle = document.createElement("span");
    particle.className = "key-particle";
    particle.style.left = Math.random() * 100 + "%";
    particle.style.top = Math.random() * 100 + "%";
    particle.style.animationDelay = Math.random() * 4 + "s";
    particle.style.animationDuration = (2 + Math.random() * 3) + "s";
    keyMenu.appendChild(particle);
}

// POINTER LIGHT
keyMenu.addEventListener("pointermove", (e) => {
    const rect = keyMenu.getBoundingClientRect();
    pointerGlow.style.left = (e.clientX - rect.left) + "px";
    pointerGlow.style.top = (e.clientY - rect.top) + "px";
    pointerGlow.style.opacity = "1";
});

keyMenu.addEventListener("pointerleave", () => {
    pointerGlow.style.opacity = "0";
});

// COPY KEY
async function copyKey() {
    const key = document.getElementById("key").value;
    const status = document.getElementById("status");
    const btnText = document.getElementById("btnText");

    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(key);
        } else {
            const input = document.getElementById("key");
            input.select();
            input.setSelectionRange(0, input.value.length);

            if (!document.execCommand("copy")) {
                throw new Error("Copy failed");
            }
        }

        status.textContent = "✓ KEY COPIED SUCCESSFULLY!";
        status.style.color = "#4ade80";
        btnText.textContent = "COPIED SUCCESSFULLY ✓";

        setTimeout(() => {
            status.textContent = "Ready to copy your access key";
            status.style.color = "#777";
            btnText.textContent = "COPY KEY";
        }, 2500);

    } catch (error) {
        status.textContent = "Copy failed. Please copy manually.";
        status.style.color = "#ff5555";
    }
}
</script>

</body>
</html>
